services:
  postgres:
    image: postgres:16-alpine
    container_name: memora_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memora_db}
      POSTGRES_USER: ${POSTGRES_USER:-memora_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - memora_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memora_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-memora_user}:${POSTGRES_PASSWORD:-memora_secret_password}@postgres:5432/${POSTGRES_DB:-memora_db}
      SECRET_KEY: ${SECRET_KEY:-e83b4c1945a0b41f89c6d3215f76b1049c32f8b5a120ef7289d0c64819a3ef21}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ENABLE_DEV_LOGIN: ${ENABLE_DEV_LOGIN:-true}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ./backend/app:/app/app
      - media_storage:/app/media
    depends_on:
      - postgres
    networks:
      - memora_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memora_frontend
    restart: always
    networks:
      - memora_net

  gateway:
    image: nginx:alpine
    container_name: memora_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot-www:/var/www/certbot:ro
      - media_storage:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - memora_net

volumes:
  postgres_data:
  media_storage:

networks:
  memora_net:
    driver: bridge
