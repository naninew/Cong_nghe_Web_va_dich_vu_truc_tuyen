<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora - Anki Core Spaced Repetition & Gamified Learning Platform</title>
    <!-- Plus Jakarta Sans Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <script>
      // Global Audio Player for Anki Cards with Web Speech fallback
      window.playAnkiAudio = function(filename) {
        if (!filename) return;
        const audioUrl = '/media/' + filename;
        const audio = new Audio(audioUrl);
        audio.play().catch(function(err) {
          // Fallback to Web Speech API if mp3 not on disk
          if ('speechSynthesis' in window) {
            const rawText = filename.replace(/\.(mp3|wav|ogg)$/i, '').replace(/_/g, ' ');
            const utterance = new SpeechSynthesisUtterance(rawText);
            utterance.lang = 'ja-JP';
            window.speechSynthesis.speak(utterance);
          }
        });
      };
    </script>
  </head>
  <body class="bg-surface font-sans text-on-surface antialiased min-h-screen selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
